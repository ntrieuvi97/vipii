[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vipii"
version = "0.3.0"
description = "Vietnamese PII detection & anonymization — zero dependencies, fully offline"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vi Nguyen" }]
keywords = ["pii", "anonymization", "vietnamese", "privacy", "llm", "redaction", "presidio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Vietnamese",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ntrieuvi97/vipii"
Issues = "https://github.com/ntrieuvi97/vipii/issues"
Changelog = "https://github.com/ntrieuvi97/vipii/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
vipii = "vipii.cli:main"

[tool.setuptools]
packages = ["vipii"]

[tool.setuptools.package-data]
vipii = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Vietnamese text is full of "ambiguous" unicode

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long Vietnamese sample sentences and parametrized inputs

[tool.mypy]
python_version = "3.10"
strict_optional = true
